x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a version-pinned image}
    restart: unless-stopped
    logging: *default-logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - backend
      - model-egress

  model-init:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a version-pinned image}
    restart: "no"
    logging: *default-logging
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Set PYTHON_BASE_IMAGE to a version-pinned image}
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: production
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:?Set the Cloudflare Access team slug}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Set the Cloudflare Access application audience}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ADMISSION_DB_PATH: /var/lib/obsidian/admission.sqlite3
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,ollama,egress-proxy
      https_proxy: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      no_proxy: localhost,127.0.0.1,ollama,egress-proxy
    depends_on:
      model-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - admission_state:/var/lib/obsidian
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - backend
      - ingress
      - proxy

  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:?Set EGRESS_PROXY_IMAGE to a version-pinned Squid image}
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /var/cache/squid:rw,noexec,nosuid,size=32m
      - /var/log/squid:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=4m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    volumes:
      - ./deploy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - proxy
      - egress

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to a version-pinned image}
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      - ingress
      - egress

networks:
  backend:
    name: obsidian-backend
    internal: true
  ingress:
    name: obsidian-ingress
    internal: true
  proxy:
    name: obsidian-proxy
    internal: true
  egress:
    name: obsidian-egress
  model-egress:
    name: obsidian-model-egress

volumes:
  ollama_models:
  admission_state:

secrets:
  tunnel_token:
    file: ./secrets/cloudflared-token