services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a version-pinned image}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - backend

  app:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:?Set PYTHON_BASE_IMAGE to a version-pinned image}
    restart: unless-stopped
    environment:
      APP_ENV: production
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:?Set the Cloudflare Access team slug}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Set the Cloudflare Access application audience}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - backend
      - ingress

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to a version-pinned image}
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ingress

networks:
  backend:
    name: obsidian-backend
  ingress:
    name: obsidian-ingress

volumes:
  ollama_models:

secrets:
  tunnel_token:
    file: ./secrets/cloudflared-token